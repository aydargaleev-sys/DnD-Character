{step===0&&<div className="stepC"><h2 className="text-2xl font-bold text-amber-900 mb-1 text-center">Выбери расу</h2><p className="text-amber-800 mb-6 italic text-center">Раса определяет внешность, бонусы и особенности</p><div className="grid grid-cols-2 md:grid-cols-4 gap-4">{races.map(r=>(<div key={r.id} onClick={()=>setRace(r)} className={`cardH rounded-xl border-2 cursor-pointer p-3 ${race?.id===r.id?"sel":""}`} style={{borderColor:race?.id===r.id?"#fbbf24":"#92400e",background:race?.id===r.id?`linear-gradient(135deg,${r.color}33,#fde68a)`:"#fef3c7",borderWidth:race?.id===r.id?"3px":"2px"}}><div className="aspect-square rounded-lg overflow-hidden mb-2 border-2 border-amber-800"><Pt id={r.id}/></div><div className="font-bold text-center text-amber-900">{r.name}</div><div className="text-xs font-bold text-center mt-1 px-2 py-1 rounded" style={{background:r.color,color:"#fef3c7"}}>{r.bonus}</div><div className="text-xs text-amber-800 mt-2 text-center">{r.desc}</div></div>))}</div>{race&&<div className="mt-6 p-4 rounded-lg border-2 stepC" style={{background:`linear-gradient(135deg,${race.color}22,#fde68a)`,borderColor:race.color}}><div className="flex items-center gap-3"><div className="w-16 h-16 rounded-full overflow-hidden border-2 border-amber-900 flex-shrink-0"><Pt id={race.id}/></div><div><div className="font-bold text-amber-900 text-lg">{race.name}</div><div className="text-sm text-amber-800 italic">{race.lore}</div></div></div></div>}</div>}
{step===1&&<div className="stepC"><h2 className="text-2xl font-bold text-amber-900 mb-1 text-center">Выбери класс</h2><p className="text-amber-800 mb-6 italic text-center">Класс — профессия героя в бою</p><div className="grid grid-cols-2 md:grid-cols-5 gap-3">{classes.map(c=>(<div key={c.id} onClick={()=>setKlass(c)} className={`cardH rounded-xl border-2 cursor-pointer p-3 ${klass?.id===c.id?"sel":""}`} style={{borderColor:klass?.id===c.id?"#fbbf24":"#92400e",background:klass?.id===c.id?`linear-gradient(135deg,${c.color}33,#fde68a)`:"#fef3c7",borderWidth:klass?.id===c.id?"3px":"2px"}}><div className="aspect-square rounded-lg overflow-hidden mb-2"><Ci id={c.id}/></div><div className="font-bold text-center text-amber-900 text-sm">{c.name}</div><div className="text-xs text-amber-800 mt-1 text-center">{c.desc}</div></div>))}</div>{klass&&<div className="mt-6 p-4 rounded-lg border-2 stepC" style={{background:`linear-gradient(135deg,${klass.color}22,#fde68a)`,borderColor:klass.color}}><div className="flex items-start gap-4 flex-wrap md:flex-nowrap"><div className="w-20 h-20 rounded-lg overflow-hidden border-2 border-amber-900 flex-shrink-0 glowing"><Ci id={klass.id}/></div><div className="flex-1"><div className="font-bold text-amber-900 text-xl">{klass.name}</div><div className="text-sm text-amber-800 italic mb-2">{klass.desc}</div><div className="grid grid-cols-1 md:grid-cols-2 gap-3"><div><div className="text-xs font-bold text-amber-900 mb-1">⚡ ЧТО УМЕЕТ:</div><ul className="text-sm text-amber-800 space-y-1">{klass.can.map((x,i)=><li key={i}>{x}</li>)}</ul></div><div className="text-sm text-amber-800 space-y-1"><div className="p-2 rounded bg-amber-100 border border-amber-700"><b>🎯 Главная характеристика:</b><br/>{klass.stat}</div><div className="p-2 rounded bg-amber-100 border border-amber-700"><b>❤️ Кость хитов:</b> d{klass.hp}</div></div></div></div></div></div>}</div>}
{step===2&&<div className="stepC"><h2 className="text-2xl font-bold text-amber-900 mb-1 text-center">Распредели характеристики</h2><p className="text-amber-800 mb-3 italic text-center">27 очков. Min 8, max 15.</p><div className="flex justify-center items-center gap-3 mb-4 flex-wrap"><div className={`text-center px-6 py-2 rounded-full border-2 border-amber-900 bg-amber-900 text-amber-50 font-bold ${pointsLeft===0?"opacity-60":""}`}>Очков: <span className="text-2xl">{pointsLeft}</span> / 27</div><button onClick={rollStats} disabled={rollAnim} className="px-4 py-2 rounded-full bg-red-900 text-amber-50 font-bold hover:bg-red-800 disabled:opacity-50">🎲 Авто-раскидать</button></div><div className="grid grid-cols-1 md:grid-cols-2 gap-3">{Object.keys(stats).map(k=>{const isM=mainStat?.includes(k);return<div key={k} className={`p-3 rounded-lg border-2 ${rollAnim?"roll":""}`} style={{borderColor:isM?"#fbbf24":"#92400e",background:isM?"linear-gradient(135deg,#fef3c7,#fde68a)":"#fef9e7"}}><div className="flex justify-between items-center"><div className="flex-1"><div className="font-bold text-amber-900 flex items-center gap-2 flex-wrap"><span className="text-2xl">{sI[k]}</span>{sN[k]}{isM&&<span className="text-xs px-2 py-0.5 rounded-full bg-amber-700 text-amber-50">★ главная</span>}</div><div className="text-xs text-amber-700">{sD[k]}</div></div><div className="flex items-center gap-2"><button onClick={()=>changeStat(k,-1)} className="w-9 h-9 rounded-full bg-amber-700 text-amber-50 font-bold hover:bg-amber-800 active:scale-90">−</button><div className="text-3xl font-bold text-amber-900 w-12 text-center">{stats[k]}</div><button onClick={()=>changeStat(k,1)} className="w-9 h-9 rounded-full bg-amber-700 text-amber-50 font-bold hover:bg-amber-800 active:scale-90">+</button></div></div><div className="text-xs text-amber-800 mt-2 flex justify-between"><span>С расой: <b className="text-base">{fStat(k)}</b></span><span>Мод: <b className="text-base text-red-800">{mdS(fStat(k))}</b></span></div></div>})}</div><div className="text-xs text-amber-700 italic mt-3 text-center">💡 Главную до 15. Потом CON для здоровья.</div></div>}
{step===3&&<div className="stepC"><h2 className="text-2xl font-bold text-amber-900 mb-1 text-center">Предыстория & мировоззрение</h2><p className="text-amber-800 mb-6 italic text-center">Кем был герой до приключений?</p><div className="grid grid-cols-2 md:grid-cols-4 gap-3 mb-6">{backgrounds.map(b=>(<div key={b.id} onClick={()=>setBg(b)} className={`cardH rounded-xl border-2 cursor-pointer p-4 text-center ${bg?.id===b.id?"sel":""}`} style={{borderColor:bg?.id===b.id?"#fbbf24":"#92400e",background:bg?.id===b.id?"#fde68a":"#fef3c7"}}><div className="text-4xl mb-2">{b.icon}</div><div className="font-bold text-amber-900">{b.name}</div><div className="text-xs text-amber-800 mt-1">{b.desc}</div></div>))}</div><div className="p-4 rounded-lg border-2 border-amber-900 bg-amber-50"><div className="font-bold text-amber-900 mb-3 text-center">⚖️ Мировоззрение</div><div className="grid grid-cols-3 gap-2">{aligns.map(a=>(<button key={a} onClick={()=>setAlign(a)} className="p-2 rounded text-xs md:text-sm transition-all hover:scale-105" style={{background:align===a?"linear-gradient(135deg,#7c2d12,#92400e)":"#fef3c7",color:align===a?"#fef3c7":"#7c2d12",border:`2px solid ${align===a?"#fbbf24":"#92400e"}`,fontWeight:align===a?"bold":"normal"}}>{a}</button>))}</div></div></div>}
{step===4&&<div className="stepC"><h2 className="text-2xl font-bold text-amber-900 mb-1 text-center">Имя и внешность</h2><p className="text-amber-800 mb-6 italic text-center">Это нужно для будущей фигурки!</p><div className="grid grid-cols-1 md:grid-cols-2 gap-4"><label className="block"><span className="text-amber-900 font-bold">⚜️ Имя героя</span><input value={name} onChange={e=>setName(e.target.value)} placeholder="напр. Торин Огнебород" className="w-full mt-1 p-2 rounded border-2 border-amber-700 bg-amber-50"/></label><label className="block"><span className="text-amber-900 font-bold">💇 Волосы</span><input value={look.hair} onChange={e=>setLook({...look,hair:e.target.value})} placeholder="чёрные длинные с косой" className="w-full mt-1 p-2 rounded border-2 border-amber-700 bg-amber-50"/></label><label className="block"><span className="text-amber-900 font-bold">👁️ Глаза</span><input value={look.eyes} onChange={e=>setLook({...look,eyes:e.target.value})} placeholder="зелёные" className="w-full mt-1 p-2 rounded border-2 border-amber-700 bg-amber-50"/></label><label className="block"><span className="text-amber-900 font-bold">🩸 Кожа / шрамы / тату</span><input value={look.skin} onChange={e=>setLook({...look,skin:e.target.value})} placeholder="бледная, шрам на щеке" className="w-full mt-1 p-2 rounded border-2 border-amber-700 bg-amber-50"/></label><label className="block md:col-span-2"><span className="text-amber-900 font-bold">✨ Особая черта / фишка</span><input value={look.trait} onChange={e=>setLook({...look,trait:e.target.value})} placeholder="всегда жуёт травинку, никому не доверяет" className="w-full mt-1 p-2 rounded border-2 border-amber-700 bg-amber-50"/></label></div>{race&&<div className="mt-6 flex items-center justify-center gap-4 p-4 rounded-lg border-2 border-amber-900 bg-amber-50 flex-wrap"><div className="w-24 h-24 rounded-full overflow-hidden border-4 border-amber-700 glowing"><Pt id={race.id}/></div><div className="text-amber-900"><div className="text-sm italic">Твой герой:</div><div className="text-xl font-bold">{name||"..."}</div><div className="text-sm">{race.name} {klass?.name}</div></div></div>}</div>}
{step===5&&<div className="stepC"><h2 className="text-3xl font-bold text-amber-900 mb-4 text-center gold">📜 Лист персонажа 📜</h2><div className="border-4 border-amber-900 rounded-lg p-4 md:p-6 bg-amber-50" style={{boxShadow:"inset 0 0 30px rgba(146,64,14,.2)"}}><div className="flex flex-col md:flex-row items-center gap-4 border-b-2 border-amber-700 pb-4 mb-4">{race&&<div className="w-24 h-24 rounded-full overflow-hidden border-4 border-amber-700 flex-shrink-0 glowing"><Pt id={race.id}/></div>}<div className="text-center md:text-left flex-1"><div className="text-3xl font-bold text-amber-900">{name||"Безымянный"}</div><div className="text-amber-800">{race?.name} • {klass?.name} • 1 уровень</div><div className="text-sm text-amber-700 italic">{bg?.name} • {align}</div></div>{klass&&<div className="w-20 h-20 rounded-lg overflow-hidden border-2 border-amber-900"><Ci id={klass.id}/></div>}</div><div className="grid grid-cols-3 md:grid-cols-6 gap-2 mb-4">{Object.keys(stats).map(k=>(<div key={k} className="text-center p-2 rounded border-2 border-amber-700 bg-amber-100"><div className="text-lg">{sI[k]}</div><div className="text-xs font-bold text-amber-900">{sN[k]}</div><div className="text-2xl font-bold text-red-800">{mdS(fStat(k))}</div><div className="text-sm text-amber-800">{fStat(k)}</div></div>))}</div><div className="grid grid-cols-3 gap-2 mb-4"><div className="text-center p-3 rounded border-2 border-red-900 bg-gradient-to-br from-red-100 to-amber-100"><div className="text-xs text-amber-900">❤️ HP</div><div className="text-2xl font-bold text-red-800">{klass?parseInt(klass.hp)+md(fStat("CON")):"—"}</div></div><div className="text-center p-3 rounded border-2 border-amber-900 bg-gradient-to-br from-amber-100 to-yellow-100"><div className="text-xs text-amber-900">⚡ Инициатива</div><div className="text-2xl font-bold text-amber-800">{mdS(fStat("DEX"))}</div></div><div className="text-center p-3 rounded border-2 border-amber-900 bg-gradient-to-br from-amber-100 to-yellow-100"><div className="text-xs text-amber-900">🎯 Бонус мастерства</div><div className="text-2xl font-bold text-amber-800">+2</div></div></div><div className="grid grid-cols-1 md:grid-cols-2 gap-3"><div className="p-3 rounded border-2 border-amber-700 bg-amber-100"><div className="font-bold text-amber-900 mb-1">⚔️ Способности класса</div><ul className="text-sm text-amber-800 list-disc pl-5">{klass?.can.map((x,i)=><li key={i}>{x}</li>)}</ul></div><div className="p-3 rounded border-2 border-amber-700 bg-amber-100"><div className="font-bold text-amber-900 mb-1">🎭 Внешность</div><div className="text-sm text-amber-800"><div><b>Волосы:</b> {look.hair||"—"}</div><div><b>Глаза:</b> {look.eyes||"—"}</div><div><b>Особенности:</b> {look.skin||"—"}</div><div><b>Черта:</b> {look.trait||"—"}</div></div></div></div><div className="mt-3 p-3 rounded border-2 border-amber-700 bg-amber-100"><div className="font-bold text-amber-900 mb-1">📖 Предыстория</div><div className="text-sm text-amber-800">{bg?.icon} {bg?.desc}</div></div><div className="text-center mt-4 italic text-amber-700">✦ Удачи в твоём первом приключении, герой! ✦</div></div><div className="text-center mt-4 flex gap-2 justify-center flex-wrap noprint"><button onClick={()=>window.print()} className="px-4 py-2 rounded bg-amber-900 text-amber-50 font-bold hover:bg-amber-800">🖨 Распечатать</button><button onClick={()=>{setStep(0);setRace(null);setKlass(null);setBg(null);setStats({STR:10,DEX:10,CON:10,INT:10,WIS:10,CHA:10});setPointsLeft(27);setName("");setLook({hair:"",eyes:"",skin:"",trait:""})}} className="px-4 py-2 rounded bg-amber-700 text-amber-50 font-bold hover:bg-amber-600">↺ Заново</button></div></div>}
<div className="flex justify-between mt-6 noprint"><button onClick={()=>setStep(Math.max(0,step-1))} disabled={step===0} className="px-5 py-2 rounded-lg bg-amber-800 text-amber-50 font-bold disabled:opacity-30 hover:bg-amber-700">← Назад</button>{step<5&&<button onClick={()=>setStep(step+1)} disabled={!canNext()} className="px-5 py-2 rounded-lg bg-red-900 text-amber-50 font-bold disabled:opacity-30 hover:bg-red-800">Далее →</button>}</div>
</div></div>)}
            ReactDOM.render(<App />, document.getElementById('artifact_react'));
        } catch(error) {
            displayError('An error occurred while loading the application.');
        }
        window.addEventListener('error', function(event) {
            displayError(event.message, event.error?.stack);
        });
        function displayError(message, stackInfo) {
            const errorContainer = document.getElementById('error-container');
            const errorMessage = document.createElement('div');
            errorMessage.textContent = message;
            errorContainer.appendChild(errorMessage);
            if(stackInfo) {
                const stackErrorMessage = document.createElement('pre');
                stackErrorMessage.textContent = stackInfo.substring(0, 130);
                errorContainer.appendChild(stackErrorMessage);
            }
            errorContainer.style.display = 'block';
        }
    </script>
