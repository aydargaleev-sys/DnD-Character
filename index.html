<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DnD Character Creator</title>
    <script src="https://unpkg.com/react@17/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@17/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Spectral:ital,wght@0,400;0,700;1,400&display=swap');

        body {
            background-color: #0f0a07;
            color: #e2d1b0;
            font-family: 'Spectral', serif;
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(45, 30, 20, 0.3) 0%, transparent 100%),
                url('https://www.transparenttextures.com/patterns/dark-leather.png');
            overflow-x: hidden;
        }

        h1, h2, h3, .title-font {
            font-family: 'Cinzel', serif;
            letter-spacing: 0.05em;
        }

        .gold-shimmer {
            background: linear-gradient(to right, #bf953f, #fcf6ba, #b38728, #fbf5b7, #aa771c);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shimmer 5s infinite linear;
            background-size: 200% auto;
        }

        @keyframes shimmer {
            to { background-position: 200% center; }
        }

        .parchment {
            background: #f4e4bc;
            background-image: url('https://www.transparenttextures.com/patterns/paper-fibers.png');
            color: #2d1e14;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5), inset 0 0 100px rgba(184, 134, 11, 0.2);
            border: 2px solid #8b6b23;
            position: relative;
        }

        .parchment::before {
            content: '';
            position: absolute;
            top: 5px; left: 5px; right: 5px; bottom: 5px;
            border: 1px solid #8b6b23;
            pointer-events: none;
        }

        .card-glow:hover {
            box-shadow: 0 0 20px rgba(184, 134, 11, 0.4);
            transform: translateY(-5px);
            transition: all 0.3s ease;
        }

        .selected-card {
            border: 3px solid #bf953f !important;
            box-shadow: 0 0 25px rgba(184, 134, 11, 0.6);
            transform: scale(1.02);
        }

        .ember {
            position: fixed;
            width: 4px;
            height: 4px;
            background: #ff4d00;
            border-radius: 50%;
            pointer-events: none;
            filter: blur(1px);
            opacity: 0;
            animation: rise 5s infinite ease-out;
        }

        @keyframes rise {
            0% { transform: translateY(100vh) scale(1); opacity: 0; }
            20% { opacity: 0.8; }
            100% { transform: translateY(-100px) translateX(100px) scale(0); opacity: 0; }
        }

        .btn-fancy {
            background: linear-gradient(135deg, #8b6b23 0%, #bf953f 50%, #8b6b23 100%);
            border: 1px solid #fcf6ba;
            color: #2d1e14;
            font-weight: bold;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-shadow: 0 1px 0 rgba(255,255,255,0.3);
        }

        .btn-fancy:hover {
            filter: brightness(1.1);
            box-shadow: 0 0 15px rgba(184, 134, 11, 0.5);
        }

        .progress-bar {
            height: 4px;
            background: #2d1e14;
            border-radius: 2px;
            position: relative;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #8b6b23, #fcf6ba);
            transition: width 0.5s ease;
        }

        @media print {
            .no-print { display: none !important; }
            body { background: white; color: black; }
            .parchment { box-shadow: none; border: 1px solid black; background: white; }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const RACES = [
            { id: 'human', name: 'Человек', desc: '+1 ко всем характеристикам. Самая универсальная раса.', color: '#d2b48c' },
            { id: 'elf', name: 'Эльф', desc: '+2 Ловкость, ночное зрение, сопротивление к очарованию.', color: '#90ee90' },
            { id: 'dwarf', name: 'Дварф', desc: '+2 Телосложение, ночное зрение, устойчивость к яду.', color: '#cd853f' },
            { id: 'halfling', name: 'Полурослик', desc: '+2 Ловкость, удачливость (переброс 1 на кубике).', color: '#ffebcd' },
            { id: 'dragonborn', name: 'Драконорожденный', desc: '+2 Сила, +1 Харизма. Дыхание стихией.', color: '#b22222' },
            { id: 'tiefling', name: 'Тифлинг', desc: '+2 Харизма, +1 Интеллект. Сопротивление огню.', color: '#4b0082' },
            { id: 'gnome', name: 'Гном', desc: '+2 Интеллект, ночное зрение, хитрость гномов.', color: '#5f9ea0' },
            { id: 'half-orc', name: 'Полуорк', desc: '+2 Сила, +1 Телосложение. Невероятная стойкость.', color: '#556b2f' }
        ];

        const CLASSES = [
            { id: 'fighter', name: 'Воин', icon: 'fa-shield-halved', hitDie: 10, prime: 'Сила', desc: 'Мастер оружия и доспехов. Идеально для начала.' },
            { id: 'wizard', name: 'Волшебник', icon: 'fa-hat-wizard', hitDie: 6, prime: 'Интеллект', desc: 'Могущественный маг, изучающий заклинания по книгам.' },
            { id: 'rogue', name: 'Плут', icon: 'fa-mask', hitDie: 8, prime: 'Ловкость', desc: 'Мастер скрытности и точных ударов в спину.' },
            { id: 'cleric', name: 'Жрец', icon: 'fa-cross', hitDie: 8, prime: 'Мудрость', desc: 'Божественный целитель и защитник союзников.' },
            { id: 'barbarian', name: 'Варвар', icon: 'fa-axe', hitDie: 12, prime: 'Сила', desc: 'Яростный боец с огромным запасом здоровья.' },
            { id: 'paladin', name: 'Паладин', icon: 'fa-shield-heart', hitDie: 10, prime: 'Сила/Харизма', desc: 'Святой рыцарь, сочетающий меч и магию.' },
            { id: 'ranger', name: 'Следопыт', icon: 'fa-bow-arrow', hitDie: 10, prime: 'Ловкость/Мудрость', desc: 'Охотник, эксперт по выживанию в дикой природе.' },
            { id: 'bard', name: 'Бард', icon: 'fa-music', hitDie: 8, prime: 'Харизма', desc: 'Музыкант, вдохновляющий друзей и мешающий врагам.' },
            { id: 'sorcerer', name: 'Чародей', icon: 'fa-wand-magic-sparkles', hitDie: 6, prime: 'Харизма', desc: 'Маг, чья сила заложена в самой крови.' },
            { id: 'warlock', name: 'Колдун', icon: 'fa-eye', hitDie: 8, prime: 'Харизма', desc: 'Черпает магию из договора с могущественным покровителем.' }
        ];

        const STATS = ['Сила', 'Ловкость', 'Телосложение', 'Интеллект', 'Мудрость', 'Харизма'];

        const App = () => {
            const [step, setStep] = useState(1);
            const [char, setChar] = useState({
                name: '',
                race: null,
                class: null,
                stats: { 'Сила': 8, 'Ловкость': 8, 'Телосложение': 8, 'Интеллект': 8, 'Мудрость': 8, 'Харизма': 8 },
                points: 27,
                appearance: ''
            });

            const nextStep = () => setStep(step + 1);
            const prevStep = () => setStep(step - 1);

            const updateStat = (name, val) => {
                const current = char.stats[name];
                const cost = val > current ? (val > 13 ? 2 : 1) : (current > 13 ? 2 : 1);
                const newPoints = val > current ? char.points - cost : char.points + cost;

                if (newPoints >= 0 && val >= 8 && val <= 15) {
                    setChar({...char, stats: {...char.stats, [name]: val}, points: newPoints});
                }
            };

            const autoRoll = () => {
                if (!char.class) return;
                const scores = [15, 14, 13, 12, 10, 8];
                const prime = char.class.prime.split('/')[0];
                const newStats = {};

                newStats[prime] = 15;
                const remainingStats = STATS.filter(s => s !== prime);
                const remainingScores = [14, 13, 12, 10, 8];

                remainingStats.forEach((s, i) => {
                    newStats[s] = remainingScores[i];
                });

                setChar({...char, stats: newStats, points: 0});
            };

            return (
                <div className="min-h-screen p-4 md:p-8 flex flex-col items-center">
                    {/* Эмберы на фоне */}
                    {[...Array(15)].map((_, i) => (
                        <div key={i} className="ember" style={{ 
                            left: Math.random() * 100 + 'vw', 
                            animationDelay: Math.random() * 5 + 's',
                            width: Math.random() * 5 + 2 + 'px',
                            height: Math.random() * 5 + 2 + 'px'
                        }}></div>
                    ))}

                    <div className="w-full max-w-4xl no-print">
                        <header className="text-center mb-8">
                            <h1 className="text-4xl md:text-6xl font-bold gold-shimmer mb-2">Создатель Героя</h1>
                            <p className="text-gray-400 italic font-serif">Твой путь в Подземелья начинается здесь...</p>
                        </header>

                        <div className="mb-8">
                            <div className="flex justify-between text-xs text-gold-500 mb-2 px-1">
                                {['Раса', 'Класс', 'Характеристики', 'Личность', 'Финал'].map((s, i) => (
                                    <span key={i} className={step > i ? 'text-yellow-500' : 'text-gray-600'}>
                                        {step > i + 1 ? '✓ ' : ''}{s}
                                    </span>
                                ))}
                            </div>
                            <div className="progress-bar">
                                <div className="progress-fill" style={{ width: `${(step/5)*100}%` }}></div>
                            </div>
                        </div>

                        {step === 1 && (
                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 animate-fade-in">
                                {RACES.map(r => (
                                    <div 
                                        key={r.id}
                                        onClick={() => setChar({...char, race: r})}
                                        className={`parchment p-4 cursor-pointer card-glow rounded-lg text-center transition-all ${char.race?.id === r.id ? 'selected-card' : 'opacity-80'}`}
                                    >
                                        <div className="w-16 h-16 mx-auto mb-3 rounded-full border-2 border-amber-900 flex items-center justify-center" style={{ backgroundColor: r.color }}>
                                            <i className="fa-solid fa-user-tag text-2xl text-amber-900"></i>
                                        </div>
                                        <h3 className="font-bold text-xl mb-1">{r.name}</h3>
                                        <p className="text-xs italic leading-tight">{r.desc}</p>
                                    </div>
                                ))}
                            </div>
                        )}

                        {step === 2 && (
                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-5 gap-4">
                                {CLASSES.map(c => (
                                    <div 
                                        key={c.id}
                                        onClick={() => setChar({...char, class: c})}
                                        className={`parchment p-4 cursor-pointer card-glow rounded-lg text-center transition-all ${char.class?.id === c.id ? 'selected-card' : 'opacity-80'}`}
                                    >
                                        <div className="text-3xl mb-3 text-amber-900">
                                            <i className={`fa-solid ${c.icon}`}></i>
                                        </div>
                                        <h3 className="font-bold text-lg mb-1">{c.name}</h3>
                                        <p className="text-[10px] uppercase font-bold text-amber-800">КЗ: d{c.hitDie}</p>
                                    </div>
                                ))}
                            </div>
                        )}

                        {step === 3 && (
                            <div className="parchment p-6 rounded-lg max-w-2xl mx-auto">
                                <div className="flex justify-between items-center mb-6 border-b border-amber-900 pb-2">
                                    <h2 className="text-2xl font-bold">Очки характеристик: {char.points}</h2>
                                    <button 
                                        onClick={autoRoll}
                                        className="btn-fancy px-4 py-1 text-xs rounded"
                                    >
                                        Авто-распределение <i className="fa-solid fa-dice-d20"></i>
                                    </button>
                                </div>
                                <div className="space-y-6">
                                    {STATS.map(s => (
                                        <div key={s} className={`flex items-center justify-between p-2 rounded ${char.class?.prime.includes(s) ? 'bg-yellow-600 bg-opacity-20 border border-yellow-700' : ''}`}>
                                            <div className="w-1/3">
                                                <div className="font-bold">{s}</div>
                                                {char.class?.prime.includes(s) && <div className="text-[10px] text-yellow-800 uppercase">Основная</div>}
                                            </div>
                                            <div className="flex items-center gap-4">
                                                <button onClick={() => updateStat(s, char.stats[s]-1)} className="w-8 h-8 rounded-full bg-amber-900 text-white">-</button>
                                                <span className="text-2xl font-bold w-6 text-center">{char.stats[s]}</span>
                                                <button onClick={() => updateStat(s, char.stats[s]+1)} className="w-8 h-8 rounded-full bg-amber-900 text-white">+</button>
                                            </div>
                                            <div className="text-xl font-bold text-amber-900 w-12 text-right">
                                                {Math.floor((char.stats[s] - 10) / 2) >= 0 ? '+' : ''}{Math.floor((char.stats[s] - 10) / 2)}
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {step === 4 && (
                            <div className="parchment p-8 rounded-xl max-w-xl mx-auto text-center space-y-6">
                                <div>
                                    <label className="block text-xl font-bold mb-2">Имя Героя</label>
                                    <input 
                                        type="text" 
                                        value={char.name}
                                        onChange={(e) => setChar({...char, name: e.target.value})}
                                        placeholder="Напр. Арагорн или Гэндальф"
                                        className="w-full p-4 bg-transparent border-2 border-amber-900 rounded-lg text-2xl text-center focus:outline-none focus:border-yellow-600"
                                    />
                                </div>
                                <div>
                                    <label className="block text-xl font-bold mb-2">Внешность</label>
                                    <textarea 
                                        rows="3"
                                        value={char.appearance}
                                        onChange={(e) => setChar({...char, appearance: e.target.value})}
                                        placeholder="Шрам на левом глазу, плащ цвета индиго..."
                                        className="w-full p-4 bg-transparent border-2 border-amber-900 rounded-lg text-lg focus:outline-none focus:border-yellow-600"
                                    ></textarea>
                                </div>
                            </div>
                        )}

                        <div className="flex justify-between mt-8 max-w-4xl w-full">
                            {step > 1 && (
                                <button onClick={prevStep} className="btn-fancy px-8 py-3 rounded-lg">Назад</button>
                            )}
                            <div className="flex-grow"></div>
                            {step < 5 ? (
                                <button 
                                    disabled={(step === 1 && !char.race) || (step === 2 && !char.class)}
                                    onClick={nextStep} 
                                    className="btn-fancy px-12 py-3 rounded-lg disabled:opacity-50"
                                >
                                    Далее
                                </button>
                            ) : (
                                <button onClick={() => window.print()} className="btn-fancy px-12 py-3 rounded-lg">
                                    Распечатать <i className="fa-solid fa-print ml-2"></i>
                                </button>
                            )}
                        </div>
                    </div>

                    {step === 5 && (
                        <div className="w-full max-w-4xl p-8 parchment rounded shadow-2xl mt-4 border-4 border-double border-amber-900">
                            <div className="flex justify-between items-start border-b-2 border-amber-900 pb-4 mb-6">
                                <div>
                                    <h2 className="text-5xl font-bold uppercase">{char.name || 'Безымянный'}</h2>
                                    <p className="text-xl italic font-bold text-amber-900">{char.race.name} {char.class.name}</p>
                                </div>
                                <div className="text-right">
                                    <div className="text-sm font-bold text-amber-800">УРОВЕНЬ</div>
                                    <div className="text-4xl font-bold">1</div>
                                </div>
                            </div>

                            <div className="grid grid-cols-6 gap-4 mb-8">
                                {STATS.map(s => {
                                    const mod = Math.floor((char.stats[s] - 10) / 2);
                                    return (
                                        <div key={s} className="border-2 border-amber-900 rounded p-2 text-center bg-white bg-opacity-50">
                                            <div className="text-[10px] font-bold uppercase">{s}</div>
                                            <div className="text-2xl font-bold">{char.stats[s]}</div>
                                            <div className="bg-amber-900 text-white rounded-full w-10 h-10 mx-auto flex items-center justify-center mt-1 -mb-6 relative z-10 font-bold border-2 border-amber-200">
                                                {mod >= 0 ? '+' : ''}{mod}
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>

                            <div className="grid grid-cols-1 md:grid-cols-2 gap-8 mt-12">
                                <div className="space-y-4">
                                    <div className="border border-amber-900 p-3 rounded">
                                        <h3 className="font-bold border-b border-amber-800 mb-2 uppercase text-sm">Здоровье и Защита</h3>
                                        <div className="flex justify-around">
                                            <div className="text-center">
                                                <div className="text-[10px] font-bold">КД</div>
                                                <div className="text-2xl font-bold">{10 + Math.floor((char.stats['Ловкость']-10)/2)}</div>
                                            </div>
                                            <div className="text-center">
                                                <div className="text-[10px] font-bold">ХП</div>
                                                <div className="text-2xl font-bold">{char.class.hitDie + Math.floor((char.stats['Телосложение']-10)/2)}</div>
                                            </div>
                                            <div className="text-center">
                                                <div className="text-[10px] font-bold">БОНУС МАСТ.</div>
                                                <div className="text-2xl font-bold text-blue-800">+2</div>
                                            </div>
                                        </div>
                                    </div>
                                    <div className="border border-amber-900 p-3 rounded">
                                        <h3 className="font-bold border-b border-amber-800 mb-2 uppercase text-sm">Внешний вид</h3>
                                        <p className="italic text-sm leading-relaxed">{char.appearance || 'Описания пока нет...'}</p>
                                    </div>
                                </div>
                                <div className="border border-amber-900 p-3 rounded">
                                    <h3 className="font-bold border-b border-amber-800 mb-2 uppercase text-sm">Классовые умения</h3>
                                    <ul className="text-sm space-y-2">
                                        {char.class.id === 'fighter' && <li>• Второе дыхание (хил 1d10+1 бонусным действием)</li>}
                                        {char.class.id === 'wizard' && <li>• Магическое восстановление (возврат ячеек на привале)</li>}
                                        {char.class.id === 'rogue' && <li>• Скрытая атака (+1d6 урона по цели с преимуществом)</li>}
                                        <li>• Владение доспехами и оружием согласно классу {char.class.name}</li>
                                        <li className="text-gray-500 italic mt-4 text-xs">Подробности будут доступны в твоем первом приключении!</li>
                                    </ul>
                                </div>
                            </div>

                            <footer className="mt-12 text-center border-t border-amber-900 pt-4 text-xs italic text-amber-900 no-print">
                                С любовью на нашу 3-месячную годовщину ❤️ Покори это подземелье!
                            </footer>
                        </div>
                    )}
                </div>
            );
        };

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
