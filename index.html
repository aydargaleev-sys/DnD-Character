<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>D&D — Создание героя</title>
<script src="https://unpkg.com/react@17/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@17/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
<style>
  #error-container { color: orange; font-size: 16px; margin: 12px; min-height: 120px; overflow-y: auto; border: 1px solid orange; padding: 10px; border-radius: 8px; background-color: #ff96000d; display: none; }
</style>
</head>
<body>
<div id="artifact_react"></div>
<div id="error-container"></div>
<script type="text/babel">
try {
function App() {
  const [step, setStep] = React.useState(0);
  const [race, setRace] = React.useState(null);
  const [klass, setKlass] = React.useState(null);
  const [bg, setBg] = React.useState(null);
  const [stats, setStats] = React.useState({STR:10,DEX:10,CON:10,INT:10,WIS:10,CHA:10});
  const [pointsLeft, setPointsLeft] = React.useState(27);
  const [name, setName] = React.useState("");
  const [look, setLook] = React.useState({hair:"",eyes:"",skin:"",trait:""});
  const [alignment, setAlignment] = React.useState("Нейтрально-добрый");

  const races = [
    {id:"human", name:"Человек", icon:"🧑", desc:"Универсалы. +1 ко всем характеристикам. Подходят под любой класс.", bonus:"+1 ко всем", lore:"Амбициозные, адаптивные, живут везде."},
    {id:"elf", name:"Эльф", icon:"🧝", desc:"Грациозные, ловкие, чувствуют магию. Видят в темноте.", bonus:"+2 Ловкость", lore:"Долгожители, мастера лука и магии."},
    {id:"dwarf", name:"Дварф", icon:"🧔", desc:"Крепкие воины гор. Стойкие к ядам, мастера кузни.", bonus:"+2 Телосложение", lore:"Гордые, верные, любят золото и эль."},
    {id:"halfling", name:"Полурослик", icon:"🧒", desc:"Маленькие, удачливые, незаметные. Идеальные плуты.", bonus:"+2 Ловкость", lore:"Жизнерадостные, любят уют и приключения."},
    {id:"tiefling", name:"Тифлинг", icon:"😈", desc:"Потомки демонов. Рога, хвост, врождённая магия огня.", bonus:"+2 Харизма, +1 Интеллект", lore:"Изгои с дьявольской кровью."},
    {id:"dragonborn", name:"Драконорождённый", icon:"🐲", desc:"Чешуя, дыхание стихии (огонь/лёд/яд). Гордые воины.", bonus:"+2 Сила, +1 Харизма", lore:"Потомки драконов, чтят честь."},
    {id:"halforc", name:"Полуорк", icon:"👹", desc:"Сильные, свирепые. В критический момент не падают от удара.", bonus:"+2 Сила, +1 Телосложение", lore:"Между двух миров, доказывают силу делом."},
    {id:"gnome", name:"Гном", icon:"🧙", desc:"Маленькие изобретатели и маги. Хитрые и любопытные.", bonus:"+2 Интеллект", lore:"Обожают механизмы, иллюзии и шутки."},
  ];

  const classes = [
    {id:"fighter", name:"Воин", icon:"⚔️", desc:"Мастер оружия и брони. Просто, надёжно, мощно.", can:["Бьёт всех подряд мечом/луком","Носит латы","Доп. атаки за раунд","Второе дыхание — лечит себя"], stat:"Сила или Ловкость", hp:"10"},
    {id:"wizard", name:"Волшебник", icon:"🧙‍♂️", desc:"Учёный маг. Книга заклинаний, огненные шары, телепорты.", can:["Огненный шар 🔥","Магическая стрела","Щит, невидимость","Учит новые заклинания из книг"], stat:"Интеллект", hp:"6"},
    {id:"rogue", name:"Плут", icon:"🗡️", desc:"Скрытность, кинжалы в спину, взлом замков, ловушки.", can:["Скрытая атака (огромный урон)","Воровство, взлом","Уклонение","Скрытность в тени"], stat:"Ловкость", hp:"8"},
    {id:"cleric", name:"Жрец", icon:"✨", desc:"Слуга бога. Лечит, бьёт нежить, бафает команду.", can:["Лечение ран","Изгнание нежити","Благословение союзников","Боевая магия света"], stat:"Мудрость", hp:"8"},
    {id:"ranger", name:"Следопыт", icon:"🏹", desc:"Охотник, лучник, друг природы и зверей.", can:["Стрельба из лука","Спутник-зверь 🐺","Следопытство","Природная магия"], stat:"Ловкость + Мудрость", hp:"10"},
    {id:"barbarian", name:"Варвар", icon:"🪓", desc:"Ярость! Безумный урон, тонна HP, никаких правил.", can:["Ярость (+урон, -урон по тебе)","Гигантский топор","Безрассудная атака","Не падает от одного удара"], stat:"Сила", hp:"12"},
    {id:"bard", name:"Бард", icon:"🎵", desc:"Музыкант-маг. Вдохновляет, обманывает, очаровывает.", can:["Вдохновение союзников","Очарование","Лечение песней","Знает понемногу всего"], stat:"Харизма", hp:"8"},
    {id:"paladin", name:"Паладин", icon:"🛡️", desc:"Святой воин. Клятва, божественный урон, аура защиты.", can:["Божественная кара (бонус-урон)","Возложение рук (лечение)","Аура защиты для союзников","Тяжёлая броня"], stat:"Сила + Харизма", hp:"10"},
    {id:"warlock", name:"Колдун", icon:"👁️", desc:"Заключил пакт с потусторонней силой. Тёмная магия.", can:["Магический луч (основная атака)","Договор с покровителем","Проклятия","Призыв фамильяра"], stat:"Харизма", hp:"8"},
    {id:"druid", name:"Друид", icon:"🌿", desc:"Маг природы. Превращается в зверей.", can:["Превращение в животное 🐻","Магия природы","Лечение","Управление стихиями"], stat:"Мудрость", hp:"8"},
  ];

  const backgrounds = [
    {id:"soldier", name:"Солдат", icon:"🎖️", desc:"Служил в армии. Знает дисциплину и тактику."},
    {id:"criminal", name:"Преступник", icon:"🃏", desc:"Жил вне закона. Связи в подполье."},
    {id:"sage", name:"Мудрец", icon:"📚", desc:"Учёный, исследователь древних знаний."},
    {id:"folk", name:"Простолюдин", icon:"🌾", desc:"Из деревни. Простой, честный, работящий."},
    {id:"noble", name:"Благородный", icon:"👑", desc:"Из знатного рода. Манеры, связи, деньги."},
    {id:"outlander", name:"Чужеземец", icon:"🏔️", desc:"Жил в дикой природе. Выживальщик."},
    {id:"entertainer", name:"Артист", icon:"🎭", desc:"Бард, актёр, акробат. Любимец толпы."},
    {id:"acolyte", name:"Послушник", icon:"⛪", desc:"Служил в храме. Знает религию."},
  ];

  const alignments = ["Законно-добрый","Нейтрально-добрый","Хаотично-добрый","Законно-нейтральный","Истинно нейтральный","Хаотично-нейтральный","Законно-злой","Нейтрально-злой","Хаотично-злой"];

  const cost = {8:0,9:1,10:2,11:3,12:4,13:5,14:7,15:9};
  function changeStat(key, delta) {
    const cur = stats[key];
    const next = cur + delta;
    if (next < 8 || next > 15) return;
    const diff = cost[next] - cost[cur];
    if (pointsLeft - diff < 0) return;
    setStats({...stats, [key]: next});
    setPointsLeft(pointsLeft - diff);
  }

  function finalStat(key) {
    let v = stats[key];
    if (!race) return v;
    const bonuses = {
      human:{STR:1,DEX:1,CON:1,INT:1,WIS:1,CHA:1},
      elf:{DEX:2}, dwarf:{CON:2}, halfling:{DEX:2},
      tiefling:{CHA:2,INT:1}, dragonborn:{STR:2,CHA:1},
      halforc:{STR:2,CON:1}, gnome:{INT:2}
    };
    return v + (bonuses[race.id]?.[key] || 0);
  }
  const mod = (v) => Math.floor((v-10)/2);
  const modStr = (v) => { const m = mod(v); return m>=0?`+${m}`:`${m}`; };

  const statNames = {STR:"Сила",DEX:"Ловкость",CON:"Телосложение",INT:"Интеллект",WIS:"Мудрость",CHA:"Харизма"};
  const statDesc = {
    STR:"Физ. урон, поднимать тяжести",
    DEX:"Ловкость, стрельба, скрытность, инициатива",
    CON:"HP, выносливость",
    INT:"Знания, магия волшебника",
    WIS:"Восприятие, магия жреца/друида",
    CHA:"Убеждение, магия барда/колдуна/паладина"
  };

  const steps = ["Раса","Класс","Характеристики","Предыстория","Внешность","Лист"];
  const card = "rounded-xl border-2 cursor-pointer transition-all p-4 hover:scale-105";
  const bgPaper = {background:"linear-gradient(135deg,#f5e6c8 0%,#e8d4a8 100%)"};

  const canNext = () => {
    if (step===0) return !!race;
    if (step===1) return !!klass;
    if (step===2) return pointsLeft===0;
    if (step===3) return !!bg;
    if (step===4) return name.trim().length>0;
    return true;
  };

  function StepHeader() {
    return (
      <div className="flex justify-between items-center mb-6 flex-wrap gap-2">
        {steps.map((s,i)=>(
          <div key={i} className={"flex items-center gap-2 " + (i===step?"text-amber-900 font-bold":"text-amber-700 opacity-60")}>
            <div className={"w-8 h-8 rounded-full flex items-center justify-center border-2 " + (i<=step?"bg-amber-700 text-amber-50 border-amber-900":"bg-amber-100 border-amber-400")}>{i+1}</div>
            <span className="text-sm hidden md:inline">{s}</span>
          </div>
        ))}
      </div>
    );
  }

  return (
    <div className="min-h-screen p-4 md:p-8" style={{background:"radial-gradient(circle at top,#3a2418,#1a0f08)",fontFamily:"Georgia, serif"}}>
      <div className="max-w-5xl mx-auto rounded-2xl shadow-2xl p-6 md:p-10" style={bgPaper}>
        <div className="text-center mb-6">
          <h1 className="text-3xl md:text-5xl font-bold text-amber-900" style={{fontFamily:"Georgia, serif",textShadow:"2px 2px 0 #c9a66b"}}>⚔ Создание героя ⚔</h1>
          <p className="text-amber-800 italic mt-2">Dungeons & Dragons — Лист персонажа</p>
        </div>
        <StepHeader />

        {step===0 && (
          <div>
            <h2 className="text-2xl font-bold text-amber-900 mb-2">Шаг 1. Выбери расу</h2>
            <p className="text-amber-800 mb-4 italic">Раса определяет внешность, базовые бонусы и особенности твоего героя.</p>
            <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
              {races.map(r=>(
                <div key={r.id} onClick={()=>setRace(r)} className={card} style={{borderColor: race?.id===r.id?"#7c2d12":"#c9a66b", background: race?.id===r.id?"#fde68a":"#fef3c7"}}>
                  <div className="text-4xl text-center">{r.icon}</div>
                  <div className="font-bold text-center text-amber-900 mt-1">{r.name}</div>
                  <div className="text-xs text-amber-800 mt-2">{r.desc}</div>
                  <div className="text-xs font-bold text-red-800 mt-2">⚡ {r.bonus}</div>
                </div>
              ))}
            </div>
            {race && (
              <div className="mt-4 p-4 rounded-lg bg-amber-100 border-2 border-amber-700">
                <div className="font-bold text-amber-900">{race.icon} {race.name}</div>
                <div className="text-sm text-amber-800 italic">{race.lore}</div>
              </div>
            )}
          </div>
        )}

        {step===1 && (
          <div>
            <h2 className="text-2xl font-bold text-amber-900 mb-2">Шаг 2. Выбери класс</h2>
            <p className="text-amber-800 mb-4 italic">Класс — это профессия героя. Что он умеет в бою и приключении.</p>
            <div className="grid grid-cols-2 md:grid-cols-5 gap-3">
              {classes.map(c=>(
                <div key={c.id} onClick={()=>setKlass(c)} className={card} style={{borderColor: klass?.id===c.id?"#7c2d12":"#c9a66b", background: klass?.id===c.id?"#fde68a":"#fef3c7"}}>
                  <div className="text-4xl text-center">{c.icon}</div>
                  <div className="font-bold text-center text-amber-900 mt-1">{c.name}</div>
                  <div className="text-xs text-amber-800 mt-2">{c.desc}</div>
                </div>
              ))}
            </div>
            {klass && (
              <div className="mt-4 p-4 rounded-lg bg-amber-100 border-2 border-amber-700">
                <div className="font-bold text-amber-900 text-lg">{klass.icon} {klass.name}</div>
                <div className="grid grid-cols-1 md:grid-cols-2 gap-2 mt-2">
                  <div>
                    <div className="text-xs font-bold text-amber-900">ЧТО УМЕЕТ:</div>
                    <ul className="text-sm text-amber-800 list-disc pl-5">
                      {klass.can.map((x,i)=><li key={i}>{x}</li>)}
                    </ul>
                  </div>
                  <div className="text-sm text-amber-800">
                    <div><b>Главная характеристика:</b> {klass.stat}</div>
                    <div><b>Кость хитов:</b> d{klass.hp}</div>
                  </div>
                </div>
              </div>
            )}
          </div>
        )}

        {step===2 && (
          <div>
            <h2 className="text-2xl font-bold text-amber-900 mb-2">Шаг 3. Характеристики</h2>
            <p className="text-amber-800 mb-2 italic">27 очков на распределение. Базово все по 8. Вкачай главную стату класса до 15!</p>
            <div className="text-center mb-4 text-xl font-bold text-red-800">Очков осталось: {pointsLeft}</div>
            <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
              {Object.keys(stats).map(k=>(
                <div key={k} className="p-3 rounded-lg border-2 border-amber-700 bg-amber-50">
                  <div className="flex justify-between items-center">
                    <div>
                      <div className="font-bold text-amber-900">{statNames[k]}</div>
                      <div className="text-xs text-amber-700">{statDesc[k]}</div>
                    </div>
                    <div className="flex items-center gap-2">
                      <button onClick={()=>changeStat(k,-1)} className="w-8 h-8 rounded-full bg-amber-700 text-amber-50 font-bold">−</button>
                      <div className="text-2xl font-bold text-amber-900 w-10 text-center">{stats[k]}</div>
                      <button onClick={()=>changeStat(k,1)} className="w-8 h-8 rounded-full bg-amber-700 text-amber-50 font-bold">+</button>
                    </div>
                  </div>
                  <div className="text-xs text-amber-800 mt-1">
                    Итог с расой: <b>{finalStat(k)}</b> (модификатор <b>{modStr(finalStat(k))}</b>)
                  </div>
                </div>
              ))}
            </div>
          </div>
        )}

        {step===3 && (
          <div>
            <h2 className="text-2xl font-bold text-amber-900 mb-2">Шаг 4. Предыстория и мировоззрение</h2>
            <div className="grid grid-cols-2 md:grid-cols-4 gap-3 mb-4">
              {backgrounds.map(b=>(
                <div key={b.id} onClick={()=>setBg(b)} className={card} style={{borderColor: bg?.id===b.id?"#7c2d12":"#c9a66b", background: bg?.id===b.id?"#fde68a":"#fef3c7"}}>
                  <div className="text-3xl text-center">{b.icon}</div>
                  <div className="font-bold text-center text-amber-900 mt-1">{b.name}</div>
                  <div className="text-xs text-amber-800 mt-1">{b.desc}</div>
                </div>
              ))}
            </div>
            <div className="p-3 rounded-lg border-2 border-amber-700 bg-amber-50">
              <div className="font-bold text-amber-900 mb-2">Мировоззрение:</div>
              <div className="grid grid-cols-3 gap-2">
                {alignments.map(a=>(
                  <button key={a} onClick={()=>setAlignment(a)} className="p-2 rounded text-sm" style={{background:alignment===a?"#7c2d12":"#fef3c7",color:alignment===a?"#fef3c7":"#7c2d12",border:"1px solid #7c2d12"}}>{a}</button>
                ))}
              </div>
            </div>
          </div>
        )}

        {step===4 && (
          <div>
            <h2 className="text-2xl font-bold text-amber-900 mb-2">Шаг 5. Имя и внешность</h2>
            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
              <label className="block">
                <span className="text-amber-900 font-bold">Имя героя</span>
                <input value={name} onChange={e=>setName(e.target.value)} placeholder="напр. Торин Огнебород" className="w-full mt-1 p-2 rounded border-2 border-amber-700 bg-amber-50"/>
              </label>
              <label className="block">
                <span className="text-amber-900 font-bold">Цвет волос</span>
                <input value={look.hair} onChange={e=>setLook({...look,hair:e.target.value})} placeholder="напр. чёрные длинные" className="w-full mt-1 p-2 rounded border-2 border-amber-700 bg-amber-50"/>
              </label>
              <label className="block">
                <span className="text-amber-900 font-bold">Цвет глаз</span>
                <input value={look.eyes} onChange={e=>setLook({...look,eyes:e.target.value})} placeholder="напр. зелёные" className="w-full mt-1 p-2 rounded border-2 border-amber-700 bg-amber-50"/>
              </label>
              <label className="block">
                <span className="text-amber-900 font-bold">Особенности внешности</span>
                <input value={look.skin} onChange={e=>setLook({...look,skin:e.target.value})} placeholder="напр. бледная, шрам на щеке" className="w-full mt-1 p-2 rounded border-2 border-amber-700 bg-amber-50"/>
              </label>
              <label className="block md:col-span-2">
                <span className="text-amber-900 font-bold">Черта характера</span>
                <input value={look.trait} onChange={e=>setLook({...look,trait:e.target.value})} placeholder="напр. всегда жуёт травинку, никому не доверяет" className="w-full mt-1 p-2 rounded border-2 border-amber-700 bg-amber-50"/>
              </label>
            </div>
          </div>
        )}

        {step===5 && (
          <div>
            <h2 className="text-3xl font-bold text-amber-900 mb-4 text-center">📜 Лист персонажа 📜</h2>
            <div className="border-4 border-amber-900 rounded-lg p-6 bg-amber-50">
              <div className="text-center border-b-2 border-amber-700 pb-3 mb-4">
                <div className="text-3xl font-bold text-amber-900">{name || "Безымянный герой"}</div>
                <div className="text-amber-800">{race?.icon} {race?.name} • {klass?.icon} {klass?.name} • 1 уровень</div>
                <div className="text-sm text-amber-700 italic">{bg?.name} • {alignment}</div>
              </div>
              <div className="grid grid-cols-2 md:grid-cols-6 gap-2 mb-4">
                {Object.keys(stats).map(k=>(
                  <div key={k} className="text-center p-2 rounded border-2 border-amber-700 bg-amber-100">
                    <div className="text-xs font-bold text-amber-900">{statNames[k]}</div>
                    <div className="text-2xl font-bold text-red-800">{modStr(finalStat(k))}</div>
                    <div className="text-sm text-amber-800">{finalStat(k)}</div>
                  </div>
                ))}
              </div>
              <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div className="p-3 rounded border-2 border-amber-700 bg-amber-100">
                  <div className="font-bold text-amber-900 mb-1">⚔ Способности класса</div>
                  <ul className="text-sm text-amber-800 list-disc pl-5">
                    {klass?.can.map((x,i)=><li key={i}>{x}</li>)}
                  </ul>
                </div>
                <div className="p-3 rounded border-2 border-amber-700 bg-amber-100">
                  <div className="font-bold text-amber-900 mb-1">🎭 Внешность</div>
                  <div className="text-sm text-amber-800">
                    <div><b>Волосы:</b> {look.hair||"—"}</div>
                    <div><b>Глаза:</b> {look.eyes||"—"}</div>
                    <div><b>Особенности:</b> {look.skin||"—"}</div>
                    <div><b>Черта:</b> {look.trait||"—"}</div>
                  </div>
                </div>
              </div>
              <div className="mt-4 grid grid-cols-3 gap-2">
                <div className="text-center p-2 rounded border-2 border-amber-700 bg-amber-100">
                  <div className="text-xs text-amber-900">HP</div>
                  <div className="text-xl font-bold text-red-800">{klass ? parseInt(klass.hp) + mod(finalStat("CON")) : "—"}</div>
                </div>
                <div className="text-center p-2 rounded border-2 border-amber-700 bg-amber-100">
                  <div className="text-xs text-amber-900">Инициатива</div>
                  <div className="text-xl font-bold text-red-800">{modStr(finalStat("DEX"))}</div>
                </div>
                <div className="text-center p-2 rounded border-2 border-amber-700 bg-amber-100">
                  <div className="text-xs text-amber-900">Бонус мастерства</div>
                  <div className="text-xl font-bold text-red-800">+2</div>
                </div>
              </div>
              <div className="text-center mt-6 italic text-amber-700 text-lg">
                ✦ С 3 месяцами вместе! Удачи в первом приключении, герой! ✦
              </div>
            </div>
            <div className="text-center mt-4 flex gap-2 justify-center flex-wrap">
              <button onClick={()=>window.print()} className="px-4 py-2 rounded bg-amber-900 text-amber-50 font-bold">🖨 Распечатать</button>
              <button onClick={()=>{setStep(0);setRace(null);setKlass(null);setBg(null);setStats({STR:10,DEX:10,CON:10,INT:10,WIS:10,CHA:10});setPointsLeft(27);setName("");setLook({hair:"",eyes:"",skin:"",trait:""});}} className="px-4 py-2 rounded bg-amber-700 text-amber-50 font-bold">↺ Начать заново</button>
            </div>
          </div>
        )}

        <div className="flex justify-between mt-6">
          <button onClick={()=>setStep(Math.max(0,step-1))} disabled={step===0} className="px-5 py-2 rounded bg-amber-800 text-amber-50 font-bold disabled:opacity-30">← Назад</button>
          {step<5 && <button onClick={()=>setStep(step+1)} disabled={!canNext()} className="px-5 py-2 rounded bg-red-900 text-amber-50 font-bold disabled:opacity-30">Далее →</button>}
        </div>
      </div>
    </div>
  );
}

ReactDOM.render(<App />, document.getElementById('artifact_react'));
} catch(error) {
  const errorContainer = document.getElementById('error-container');
  errorContainer.style.display = 'block';
  errorContainer.textContent = 'Ошибка: ' + error.message;
}
</script>
</body>
</html>
